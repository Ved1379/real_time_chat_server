<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InstaGo Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                Insta<span>Go</span>
            </div>


            <!-- YOUR USERNAME -->
            <div class="profile-card">

                <div class="profile-label">
                    YOU
                </div>

                <input
                    type="text"
                    id="username"
                    class="username-input"
                    placeholder="Enter your username..."
                    autocomplete="off"
                >

                <div class="connection">

                    <span
                        id="statusDot"
                        class="status-dot"
                    ></span>

                    <span id="status">
                        Offline
                    </span>

                </div>

                <button
                    id="connectButton"
                    class="connect-btn"
                    onclick="connect()"
                >
                    Connect
                </button>

            </div>


            <!-- RECIPIENT -->
            <div class="chat-selection">

                <div class="section-title">
                    CHAT WITH
                </div>

                <input
                    type="text"
                    id="recipient"
                    class="recipient-input"
                    placeholder="Enter username..."
                    autocomplete="off"
                    onkeydown="handleRecipient(event)"
                >

                <p class="recipient-help">
                    Press Enter to open the chat
                </p>

            </div>

        </aside>


        <!-- CHAT -->
        <main class="chat">


            <!-- CHAT HEADER -->
            <header class="chat-header">

                <div class="chat-user">

                    <h2 id="chatTitle">
                        Select a user
                    </h2>

                    <p id="chatSubtitle">
                        Enter a username to start chatting
                    </p>

                </div>


                <div
                    id="connectionStatus"
                    class="connection-status"
                >
                    Offline
                </div>

            </header>


            <!-- MESSAGES -->
            <section
                id="output"
                class="messages"
            >

                <div class="welcome">

                    <div class="welcome-icon">
                        💬
                    </div>

                    <h2>
                        Welcome to InstaGo
                    </h2>

                    <p>
                        Connect with a user and start chatting.
                    </p>

                </div>

            </section>


            <!-- MESSAGE INPUT -->
            <div class="input-area">

                <input
                    type="text"
                    id="message"
                    placeholder="Write a message..."
                    autocomplete="off"
                    onkeydown="handleEnter(event)"
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                    aria-label="Send message"
                >
                    ➤
                </button>

            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
