<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaGo • Step 1: Register</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <!-- ONBOARDING FLOW TIMELINE -->
            <div class="flow-steps">
                <span class="flow-step active">1. Register</span>
                <span class="step-arrow">➔</span>
                <span class="flow-step">2. Login</span>
                <span class="step-arrow">➔</span>
                <span class="flow-step">3. Chat</span>
            </div>

            <div class="brand-badge">💬</div>
            <h1>Insta<span>Go</span></h1>
            <p class="subtitle">Step 1: Create your account to start messaging</p>

            <div id="sessionNotice" class="session-info"></div>

            <form id="registerForm">

                <div class="input-group">
                    <label for="username">Choose a Username</label>
                    <input
                        type="text"
                        id="username"
                        placeholder="e.g. alex, sarah_99"
                        autocomplete="username"
                        minlength="3"
                        maxlength="24"
                        required
                        autofocus
                    >
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="At least 4 characters"
                        autocomplete="new-password"
                        minlength="4"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        autocomplete="new-password"
                        minlength="4"
                        required
                    >
                </div>

                <button type="submit" id="submitBtn">
                    <span>Create Account & Continue</span>
                    <span>→</span>
                </button>

            </form>

            <p id="message"></p>

            <div class="auth-footer">
                <div>Already registered? <a href="login.html">Sign In to your account →</a></div>
            </div>

        </div>

    </div>

    <script src="register.js"></script>

</body>
</html>
